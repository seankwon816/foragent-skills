name: Static product copy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: node --test tests/static-copy.test.mjs
      - name: Install the locked Python environment manager
        run: pipx install uv==0.10.9
      - name: Exercise both local MCP bridges
        run: node verify/verify-e2e.mjs
